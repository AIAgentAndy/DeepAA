name: Node 验证

on:
  push:
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x, 24.x]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 全量测试（vitest）
        shell: bash
        run: set -o pipefail && pnpm test:vitest 2>&1 | tee vitest-output.log

      - name: 全量测试（sqlite）
        shell: bash
        run: set -o pipefail && pnpm test:sqlite 2>&1 | tee sqlite-output.log

      - name: 失败摘要（注解）
        if: failure()
        shell: bash
        run: |
          emit() {
            local log="$1"
            [ -f "$log" ] || return 0
            local clean="${log%.log}-clean.log"
            sed 's/\x1b\[[0-9;]*m//g' "$log" > "$clean" || cp "$log" "$clean"
            local hits
            hits=$(grep -A 6 -E "FAIL |not ok [1-9]|^# fail [1-9]|failing tests|Unhandled" "$clean" | grep -v "^--$" | grep -v "0 failed" | head -60 || true)
            if [ -z "$hits" ]; then
              # 无用例级失败行：疑似进程崩溃，回退输出日志尾部。
              hits=$(tail -n 24 "$clean")
            fi
            local count=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              printf '::error title=%s::%s\n' "$log" "$(printf '%s' "$line" | cut -c1-220)"
              count=$((count+1))
              if [ "$count" -ge 10 ]; then break; fi
            done <<< "$hits"
          }
          emit vitest-output.log
          emit sqlite-output.log

      - name: 生产构建
        run: pnpm build

      - name: 验证 Node-only 运行时
        run: pnpm verify:node-only

      - name: 验证发布包
        if: matrix.node == '22.x'
        run: pnpm test:package
